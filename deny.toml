# cargo-deny configuration. It catches known advisories, licences and odd sources.
# It does not catch a new malicious release: the versions are pinned exactly for that.
[graph]
all-features = false

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Unicode-3.0", "Unlicense", "Zlib", "CC0-1.0", "MPL-2.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

# The crates in this workspace are not published to crates.io. Their licence is MIT OR Apache-2.0
# (LICENSE-MIT, LICENSE-APACHE).
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Crates in this workspace refer to each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
