[package]
name = "apikeybin-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Features are named one by one on purpose. x-wing and ed25519-dalek do NOT zero their
# secrets unless the `zeroize` feature is on, and x-wing's default feature set is empty.
[dependencies]
x-wing = { version = "=0.1.1", default-features = false, features = ["zeroize", "getrandom"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
hkdf = { version = "=0.13.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
hmac = { version = "=0.13.0", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = { version = "=0.4.3", default-features = false }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc", "derive"] }
ciborium = { version = "=0.2.2", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }

[dev-dependencies]
proptest = "=1.12.0"
x-wing = { version = "=0.1.1", default-features = false, features = ["zeroize", "getrandom", "hazmat"] }
