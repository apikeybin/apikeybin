[package]
name = "apikeybin-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "apikeybin"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
apikeybin-core = { path = "../apikeybin-core" }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
rpassword = "=7.5.4"
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
